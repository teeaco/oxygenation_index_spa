[package]
name = "oxygenation_guest_tauri"
version = "0.1.0"
description = "Guest desktop wrapper for oxygenation index frontend"
authors = ["IU5 Student"]
edition = "2021"

[lib]
name = "oxygenation_guest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-cors-fetch = "2.1.1"
